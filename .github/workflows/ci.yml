name: API CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify formatting, database migrations, and tests
        run: docker compose run --rm -e CI=true checks

      - name: Start API and PostGIS
        run: docker compose up -d --build --wait --wait-timeout 90
