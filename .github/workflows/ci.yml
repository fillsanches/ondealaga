name: API CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          version: "0.13.9"

      - name: Run tests
        run: uv run --locked python -m pytest -q

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Check Python formatting
        run: uv run --locked ruff format --check .

      - name: Start API and PostGIS
        run: docker compose up -d --build --wait --wait-timeout 90

      - name: Verify database migrations
        run: |
          docker compose exec -T api uv run --locked --no-dev alembic upgrade head
          docker compose exec -T api uv run --locked --no-dev alembic current --check-heads
          docker compose exec -T db psql -U onde_alaga -d onde_alaga -v ON_ERROR_STOP=1 \
            -c 'SELECT PostGIS_Version();'
